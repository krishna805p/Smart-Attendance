<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>

<!--
  No Babel / JSX here on purpose: app.js is written with plain
  React.createElement calls so this page loads instantly and
  reliably via file:// in every browser (Babel's in-browser JSX

  block for file:// pages).
-->
